name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Shell syntax
        run: bash -n install.sh && bash -n skills/nfseai/scripts/setup.sh
      - name: Versions, skill frontmatter, manifests and fixtures
        run: python tools/check_release.py
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit tests (no network)
        run: python -m pytest
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the skill for every agent and the nfseai command
        run: bash install.sh --agent all
      - name: The command answers and reports that no company is connected
        run: |
          "$HOME/.nfseai/bin/nfseai" --version
          set +e
          "$HOME/.nfseai/bin/nfseai" status > status.json
          code=$?
          set -e
          cat status.json
          test "$code" -eq 3
          test -f "$HOME/.claude/skills/nfseai/SKILL.md"
          test -f "$HOME/.agents/skills/nfseai/SKILL.md"
          test -f "$HOME/.config/opencode/skills/nfseai/SKILL.md"
          test -f "$HOME/.gemini/config/skills/nfseai/SKILL.md"
          test -f "$HOME/.hermes/skills/productivity/nfseai/SKILL.md"
      - name: The interactive wizard refuses to run without a terminal
        run: |
          set +e
          "$HOME/.nfseai/bin/nfseai" conectar < /dev/null
          code=$?
          set -e
          test "$code" -eq 2
      - name: Uninstall removes the skill and keeps the data directory
        run: |
          bash install.sh --uninstall
          test ! -e "$HOME/.claude/skills/nfseai"
          test -d "$HOME/.nfseai"
